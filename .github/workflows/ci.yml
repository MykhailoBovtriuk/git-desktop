name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests (${{ matrix.os }})
    # git-service tests run against real git repos, so cross-platform
    # coverage here is meaningful, not decorative.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Coverage (with thresholds) on Linux; plain test run elsewhere.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage
      - if: matrix.os != 'ubuntu-latest'
        run: npm test
